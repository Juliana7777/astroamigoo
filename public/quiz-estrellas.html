
<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AstroAmigo | Cuestionario de Estrellas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body class="fondo-estrellas">

    <main class="container py-5">

        <h1 class="text-center titulos mb-4">
            Cuestionario de las Estrellas
        </h1>

        <p class="text-center lead mb-5">
            Pon a prueba tus conocimientos sobre las estrellas y su formación.
        </p>

        <form id="formulario-cuestionario">

            <div id="contenedor-preguntas" class="contenido-pagina">
                <p class="text-center">Cargando preguntas...</p>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary">
                    Comprobar respuestas
                </button>
            </div>

        </form>

        <div id="resultado" class="text-center mt-4"></div>

    </main>

    <script src="quiz-estrellas.js"></script>

</body>
</html>
